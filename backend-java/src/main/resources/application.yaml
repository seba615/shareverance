server:
  port: 8080
spring:
  application:
    name: shareverance-java
  flyway:
    locations: classpath:db/migration
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
python:
  service:
    url: ${PYTHON_SERVICE_URL:http://python-service:8000}
security:
  clients:
    python-service:
      client-id: ${PYTHON_CLIENT_ID:python-prediction-service}
      client-secret: ${PYTHON_CLIENT_SECRET:}
