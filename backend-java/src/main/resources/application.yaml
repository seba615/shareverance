server:
  port: 8080
spring:
  application:
    name: shareverance-java
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/shareverance}
    username: ${SPRING_DATASOURCE_USERNAME:shareverance_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:shareverance_local_only}
    driver-class-name: org.postgresql.Driver
  flyway:
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState
receipts:
  storage-path: ${RECEIPTS_STORAGE_PATH:/data/receipts}
  max-file-size-bytes: 10485760
  max-pixels: 50000000
python:
  service:
    url: ${PYTHON_SERVICE_URL:http://python-service:8000}
    connect-timeout-ms: ${PYTHON_SERVICE_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${PYTHON_SERVICE_READ_TIMEOUT_MS:5000}
security:
  cookies:
    secure: ${SECURE_COOKIES:false}
  clients:
    python-service:
      client-secret: ${PYTHON_CLIENT_SECRET:}
