name: shareverance
services:
  postgres:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shareverance}
      POSTGRES_USER: ${POSTGRES_USER:-shareverance_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copiar .env.example a .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
  database-access:
    image: postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?Copiar .env.example a .env}
      JAVA_DB_PASSWORD: ${JAVA_DB_PASSWORD:-shareverance_java_local_only}
      PYTHON_DB_PASSWORD: ${PYTHON_DB_PASSWORD:-shareverance_python_sql_local_only}
    volumes:
      - ./database/configure-access.sql:/bootstrap/configure-access.sql:ro
    command: ["psql", "-h", "postgres", "-U", "${POSTGRES_USER:-shareverance_dev}", "-d", "${POSTGRES_DB:-shareverance}", "-f", "/bootstrap/configure-access.sql"]
    depends_on:
      postgres:
        condition: service_healthy
  python-service:
    build: ./service-python
    environment:
      PYTHON_DB_HOST: postgres
      PYTHON_DB_PORT: 5432
      PYTHON_DB_NAME: ${POSTGRES_DB:-shareverance}
      PYTHON_DB_USER: shareverance_python
      PYTHON_DB_PASSWORD: ${PYTHON_DB_PASSWORD:-shareverance_python_sql_local_only}
      PYTHON_CLIENT_SECRET: ${PYTHON_CLIENT_SECRET:?Definir PYTHON_CLIENT_SECRET en .env}
      PYTHON_CLIENT_SECRET_PREVIOUS: ${PYTHON_CLIENT_SECRET_PREVIOUS:-}
    depends_on:
      postgres:
        condition: service_healthy
      database-access:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
  java-service:
    build: ./backend-java
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shareverance}
      SPRING_DATASOURCE_USERNAME: shareverance_java
      SPRING_DATASOURCE_PASSWORD: ${JAVA_DB_PASSWORD:-shareverance_java_local_only}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-shareverance}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-shareverance_dev}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?Copiar .env.example a .env}
      PYTHON_SERVICE_URL: http://python-service:8000
      PYTHON_CLIENT_SECRET: ${PYTHON_CLIENT_SECRET:?Definir PYTHON_CLIENT_SECRET en .env}
    depends_on:
      postgres:
        condition: service_healthy
      database-access:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
  frontend:
    build: ./frontend
    environment:
      VITE_JAVA_API_PROXY_TARGET: http://java-service:8080
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-5173}:5173"
    depends_on:
      java-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
